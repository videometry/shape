<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHAPE — Sacred Meditations Sanctuary · Videometry</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style id="portal-lock-styles">
    :root {
      --bg-dark: #05070c;
      --bg-card: #0e131f;
      --border: #252f45;
      --gold: #eccb7c;
      --gold-light: #ffe49e;
      --cyan: #66d9fa;
      --text-main: #f3efe6;
      --text-muted: #94a1b5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
    }
    .lock-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(236, 203, 124, 0.13), transparent 55%),
        radial-gradient(circle at 50% 85%, rgba(102, 217, 250, 0.08), transparent 50%),
        #05070c;
    }
    .lock-card {
      width: 100%;
      max-width: 450px;
      background: rgba(14, 19, 31, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(236, 203, 124, 0.34);
      border-radius: 18px;
      padding: 38px 32px 30px;
      box-shadow: 0 26px 68px rgba(0, 0, 0, 0.72), 0 0 42px rgba(236, 203, 124, 0.08);
      text-align: center;
    }
    .lock-icon-ring {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236, 203, 124, 0.20) 0%, rgba(236, 203, 124, 0.03) 72%);
      border: 1px solid rgba(236, 203, 124, 0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 28px rgba(236, 203, 124, 0.16);
    }
    .lock-icon-ring svg {
      width: 46px;
      height: 46px;
      stroke: var(--gold);
      fill: none;
      stroke-width: 1.25;
      animation: slowTurn 36s linear infinite;
    }
    @keyframes slowTurn {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .lock-badge {
      display: inline-block;
      font-size: 0.70rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      color: var(--gold-light);
      background: rgba(236, 203, 124, 0.11);
      border: 1px solid rgba(236, 203, 124, 0.35);
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 12px;
    }
    .lock-title {
      font-family: "Optima", Georgia, serif;
      font-size: 1.55rem;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.4px;
      margin-bottom: 7px;
    }
    .lock-subtitle {
      font-size: 0.87rem;
      color: var(--text-muted);
      line-height: 1.52;
      margin-bottom: 24px;
    }
    .lock-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }
    .lock-label {
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--gold-light);
      margin-bottom: 5px;
      display: block;
    }
    .lock-input-wrap {
      position: relative;
    }
    .lock-input {
      width: 100%;
      padding: 13px 52px 13px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #080b13;
      color: #ffffff;
      font-size: 0.96rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .lock-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(236, 203, 124, 0.18);
    }
    .lock-toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.82rem;
      padding: 4px 6px;
    }
    .lock-toggle-pw:hover {
      color: var(--gold-light);
    }
    .lock-remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .lock-remember input {
      accent-color: var(--gold);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
    .lock-error {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      text-align: center;
      font-weight: 500;
    }
    .lock-error.visible {
      display: block;
    }
    .lock-btn {
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      border: 1px solid #f5cf76;
      background: linear-gradient(135deg, #dfaf49 0%, #b58222 100%);
      color: #080a10;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      margin-top: 4px;
    }
    .lock-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .lock-footer {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(37, 47, 69, 0.75);
      font-size: 0.74rem;
      color: #6b778d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
  <style id="portal-main-styles"></style>
</head>

    </div>

    function togglePwVisibility() {
      const input = document.getElementById("passInput");
      const btn = document.getElementById("pwToggleBtn");
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Hide";
      } else {
        input.type = "password";
        btn.textContent = "Show";
      }
    }

    function decryptWithPassword(rawPassword) {
      const candidates = [rawPassword, rawPassword.toLowerCase()];
      for (const password of candidates) {
        try {
          const salt = CryptoJS.enc.Hex.parse(ENC_PAYLOAD.salt);
          const iv = CryptoJS.enc.Hex.parse(ENC_PAYLOAD.iv);
          const ctWords = CryptoJS.enc.Base64.parse(ENC_PAYLOAD.ct);

          const derived = CryptoJS.PBKDF2(password, salt, {
            keySize: 512 / 32,
            iterations: ENC_PAYLOAD.iter,
            hasher: CryptoJS.algo.SHA256
          });

          const aesKey = CryptoJS.lib.WordArray.create(derived.words.slice(0, 8), 32);
          const hmacKey = CryptoJS.lib.WordArray.create(derived.words.slice(8, 16), 32);

          const dataToMac = iv.clone().concat(ctWords);
          const computedTag = CryptoJS.HmacSHA256(dataToMac, hmacKey).toString(CryptoJS.enc.Hex);
          if (computedTag !== ENC_PAYLOAD.tag) {
            continue;
          }

          const decrypted = CryptoJS.AES.decrypt(
            { ciphertext: ctWords },
            aesKey,
            { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
          );
          const jsonStr = decrypted.toString(CryptoJS.enc.Utf8);
          if (!jsonStr) continue;
          return JSON.parse(jsonStr);
        } catch (e) {
          continue;
        }
      }
      return null;
    }

    function renderUnlockedPayload(data) {
      window.lockPortal = function() {
        try {
          localStorage.removeItem(STORAGE_KEY);
          sessionStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        window.location.reload();
      };

      const mainStyleEl = document.getElementById("portal-main-styles");
      if (mainStyleEl && data.headCss) {
        mainStyleEl.textContent = data.headCss;
      }

      const container = document.createElement("div");
      container.innerHTML = data.bodyHtml;

      const scripts = Array.from(container.querySelectorAll("script"));
      scripts.forEach(s => s.parentNode.removeChild(s));

      document.body.innerHTML = container.innerHTML;

      scripts.forEach(oldScript => {
        const newScript = document.createElement("script");
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      });
    }

    function handleUnlock(e) {
      if (e) e.preventDefault();
      const pass = document.getElementById("passInput").value.trim();
      const remember = document.getElementById("rememberCheck").checked;
      const errEl = document.getElementById("errorMsg");

      const data = decryptWithPassword(pass);
      if (!data) {
        errEl.classList.add("visible");
        return;
      }

      errEl.classList.remove("visible");
      try {
        const normalizedPass = pass.toLowerCase();
        if (remember) {
          localStorage.setItem(STORAGE_KEY, btoa(unescape(encodeURIComponent(normalizedPass))));
        } else {
          sessionStorage.setItem(STORAGE_KEY, btoa(unescape(encodeURIComponent(normalizedPass))));
        }
      } catch (err) {}

      renderUnlockedPayload(data);
    }

    (function autoCheck() {
      try {
        const savedB64 = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
        if (savedB64) {
          const savedPass = decodeURIComponent(escape(atob(savedB64)));
          const data = decryptWithPassword(savedPass);
          if (data) {
            renderUnlockedPayload(data);
            return;
          }
        }
      } catch (e) {}
      const input = document.getElementById("passInput");
      if (input) input.focus();
    })();
  </script>
</body>
